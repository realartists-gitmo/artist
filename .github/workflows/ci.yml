name: Artist CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      # The legacy AST crate is intentionally outside this platform rebuild;
      # format gates cover the platform packages that this workflow builds.
      - run: cargo fmt -p artist-agent --check
      - run: cargo fmt -p artist-cli --check
      - run: cargo fmt -p artist-component --check
      - run: cargo fmt -p artist-session --check
      - run: cargo fmt -p llm-provider --check
      - run: cargo test --workspace
      - run: cargo build --profile product --bin artistd
