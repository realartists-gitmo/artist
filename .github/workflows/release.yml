name: Artist Release Artifacts

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    name: release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: artist-linux-x86_64.tar.gz
          - os: macos-latest
            archive: artist-macos-arm64.tar.gz
          - os: windows-latest
            archive: artist-windows-x86_64.zip

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
      - run: cargo build --profile product --bin artistd
      - name: Package Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/product/artistd dist/artistd
          tar -czf "dist/${{ matrix.archive }}" -C dist artistd
      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/product/artistd.exe dist/artistd.exe
          Compress-Archive -Path dist/artistd.exe -DestinationPath "dist/${{ matrix.archive }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.archive }}

