[package]
name = "artist-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
async-stream = "0.3"
artist-rules = { path = "../artist-rules" }
artist-session = { path = "../artist-session" }
artist-tools = { path = "../artist-tools" }
artist-extensions = { path = "../artist-extensions" }
base64 = "0.23"
dashmap = "6"
dirs = "6"
futures = "0.3"
llm-provider = { path = "../llm-provider" }
rig-core = "0.41.0"
rmcp = { version = "2.2", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "1.1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
rig-agent = "0.41.0"

[dev-dependencies]
rig-core = { version = "0.41.0", features = ["test-utils"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
