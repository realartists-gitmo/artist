[package]
name = "artist-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
artist-tool-api = { path = "../artist-tool-api" }
anyhow = "1"
async-stream = "0.3"
artist-memory = { path = "../artist-memory" }
# `ranking` only — the code-search tools rank artist-memory's hits; the index,
# embedder and model download stay out.
artist-ast = { path = "../artist-ast", default-features = false, features = [
    "ranking",
] }
artist-registry = { path = "../artist-registry" }
artist-rules = { path = "../artist-rules" }
artist-session = { path = "../artist-session" }
artist-tools = { path = "../artist-tools" }
artist-canvas = { path = "../artist-canvas" }
artist-computer = { path = "../artist-computer" }
artist-extensions = { path = "../artist-extensions" }
base64 = "0.23"
dashmap = "6"
dirs = "6"
futures = "0.3"
globset = "0.4"
ignore = "0.4"
regex = "1"
similar = "3"
llm-provider = { path = "../llm-provider" }
rig-core = "0.41.0"
rmcp = { version = "2.2", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
schemars = "1"
# `default-features = false` is load-bearing: the default set includes
# `default-tls`, which pulls native-tls and links OpenSSL *alongside* the rustls
# stack everything else here already uses. Cargo unifies features across the
# graph, so leaving defaults on here silently overrode the careful
# rustls-only configuration in `artist-ast` and `llm-provider` too.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "http2",
    "charset",
    # Uploading an image to a files endpoint, so it rides later turns as an id
    # rather than as base64 in every request.
    "multipart",
    "rustls-tls-native-roots",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
toml = "1.1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
rig-agent = "0.41.0"

[dev-dependencies]
artist-config = { path = "../artist-config" }
proptest = "1"
http = "1"
rig-core = { version = "0.41.0", features = ["test-utils"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
