[package]
name = "artist-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
async-stream = "0.3"
async-trait = "0.1"
artist-session = { path = "../artist-session" }
artist-component = { path = "../artist-component" }
artist-kernel = { path = "../artist-kernel" }
base64 = "0.23"
dirs = "6"
futures = "0.3"
fs2 = "0.4"
llm-provider = { path = "../llm-provider" }
rig-core = "0.41.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "sync", "rt", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
rig-agent = "0.41.0"
toon-format = { version = "0.5", default-features = false }

[dev-dependencies]
rig-core = { version = "0.41.0", features = ["test-utils"] }
tempfile = "3"
toml = "1.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
