[package]
name = "artist-extensions"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
artist-tool-api = { path = "../artist-tool-api" }
anyhow = "1"
dirs = "6"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
rig-core = "0.41.0"
tokio = { version = "1", features = ["macros", "process", "sync", "io-util", "rt"] }
toml = "1.1"
wasmtime = { version = "47", default-features = false, features = ["async", "component-model", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "47", default-features = false }

[dev-dependencies]
tempfile = "3"
