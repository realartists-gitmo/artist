[package]
name = "artist-logic"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
blake3 = "1"
# One entropy draw per graph, for the nominal allocator. `alloc()` used to be a
# counter from 4096, which meant every store minted the same ids — and we ship
# two (global.rocks, project.rocks) that `Memory::search` already merges.
getrandom = "0.3"
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
