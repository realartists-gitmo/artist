[package]
name = "artist-session"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
artist-registry = { path = "../artist-registry" }
artist-empirical = { path = "../../muse_v6/crates/artist-empirical" }
muse-artist-adapter = { path = "../../muse_v6/crates/muse-artist-adapter" }
muse-core = { path = "../../muse_v6/crates/muse-core" }
muse-occurrence = { path = "../../muse_v6/crates/muse-occurrence" }
muse-ontology = { path = "../../muse_v6/crates/muse-ontology" }
muse-reasoning = { path = "../../muse_v6/crates/muse-reasoning" }
muse-registry = { path = "../../muse_v6/crates/muse-registry" }
anyhow = "1"
base64 = "0.23"
fs2 = "0.4"
rig-core = "0.41.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt"] }
toml = "1.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
