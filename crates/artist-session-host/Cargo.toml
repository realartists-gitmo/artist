[package]
name = "artist-session-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "artist-session-host"
path = "src/main.rs"

[dependencies]
anyhow = "1"
artist-session = { path = "../artist-session" }
artist-cli = { path = "../artist-cli", default-features = false }
artist-computer = { path = "../artist-computer" }
artist-ui-core = { path = "../artist-ui-core" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
