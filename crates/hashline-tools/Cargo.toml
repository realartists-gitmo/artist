[package]
name = "hashline-tools"
version = "0.1.0"
edition = "2021"
description = "Deterministic semantic anchor file tools with multi-agent coordination"

license = "AGPL-3.0-only"
readme = "FRANKENSTEIN.md"
keywords = ["agents", "file-edit", "anchors", "hash"]
categories = ["development-tools", "filesystem"]


[dependencies]
artist-ast = { path = "../artist-ast", default-features = false }
anyhow = "1"
blake3 = "1"
fs2 = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1", features = ["fs", "io-util", "sync", "rt", "macros", "time"] }
tempfile = "3"
teca = "0.1.0"

uuid = { version = "1", features = ["v4"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[[example]]
name = "basic"
required-features = []
