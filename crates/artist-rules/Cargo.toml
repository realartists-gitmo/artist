[package]
name = "artist-rules"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Programmable rule plugins (wasmtime component host). Enabled by artist-cli;
# off here so `cargo test -p artist-rules` stays fast.
wasm = ["dep:wasmtime", "dep:wasmtime-wasi"]

[dependencies]
anyhow = "1"
artist-session = { path = "../artist-session" }
dirs = "6"
regex = "1"
rig-core = "0.41.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "1.1"
# Feature set mirrors `artist-extensions`, which already disables defaults.
# Both must agree: Cargo unifies features across the graph, so defaults left on
# in either crate re-enable them for both — which is how `ittapi-sys` (C) was
# reaching the binary via wasmtime's default profiling support.
wasmtime = { version = "47", optional = true, default-features = false, features = [
    "async",
    "component-model",
    "cranelift",
    "runtime",
    "std",
    # `gc` gates `Config::wasm_exceptions`, which `wasm.rs` calls to turn the
    # proposal *off*. Dropping the feature removes the setter, not the risk.
    "gc",
    "gc-null",
] }
wasmtime-wasi = { version = "47", optional = true, default-features = false }

[dev-dependencies]
tempfile = "3"
