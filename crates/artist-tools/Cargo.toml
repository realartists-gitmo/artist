[package]
name = "artist-tools"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
artist-tool-api = { path = "../artist-tool-api" }
anyhow = "1"
# Everything except `search` and `cli`. Retrieval is artist-memory's job, so
# the embedder, HTTP stack and model loader stay out of the tree; `ranking`
# comes along for free with `impact`/`context` and costs no dependencies.
artist-ast = { path = "../artist-ast", default-features = false, features = [
    "surface",
    "graphs",
    "impact",
    "context",
    "run",
    "squeeze",
] }
base64 = "0.23"
dashmap = "6"
dirs = "6"
fff-search = "0.10.1"
globset = "0.4"
# Unit discovery honours .gitignore, so build output never becomes a "crate".
ignore = "0.4"
hashline-tools = { path = "../hashline-tools" }
portable-pty = "0.9"
regex = "1"
rig-core = "0.41.0"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
similar = "3"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "process", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
# The terminal's visible screen is an emulator state, not a regex-cleaned
# transcript. Pin upstream `main` so the PTY renderer tracks wezterm-term's
# production parser semantics reproducibly.
wezterm-term = { git = "https://github.com/wezterm/wezterm.git", rev = "e723cf5005098fde4ef05cf73d7f40d29d85ad5f", package = "wezterm-term" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
