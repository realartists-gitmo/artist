[package]
name = "artist-ast"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "AST navigation engine: shape, public API surface, import and call graphs, structural search and rewrite"

# Fork of ast-bro (MIT, https://github.com/aeroxy/ast-bro) at upstream d9bccef.
# See LICENSE-ast-bro. The CLI, installers, read-intercept hook and MCP server
# are dropped; artist owns those. What remains is the analysis engine.

[features]
# Everything is on by default; the gates exist so a consumer that wants only
# structural shape does not compile the graph, retrieval and rewrite engines.
#
# Always compiled (the base): `core`, the language adapters, `file_filter`,
# `path_glob`, `project_root`, `main_helpers`, and `search::cache` — the last
# because `graph_cache` reuses its file-delta helpers, which are generic
# file-hashing rather than retrieval.
default = ["cli", "full"]
full = [
    "surface",
    "graphs",
    "impact",
    "context",
    "ranking",
    "search",
    "run",
    "squeeze",
]

# True public API surface: resolves `pub use` / `__all__` re-export chains.
surface = []
# Import graph, call graph, and the persistent cache behind both. These three
# are mutually recursive upstream, so they gate as one unit. `deps/extract.rs`
# reads re-export data, hence the dependency on `surface`.
graphs = ["surface", "dep:rayon", "dep:bincode", "dep:fs2"]
# Composite analyses layered on the graphs. Nothing depends on either, so they
# are pure leaves.
impact = ["graphs"]
context = ["graphs"]
# Ranking without a backend: RRF fusion, file-coherence and exact-definition
# boosting, test/stub penalties, and the `CandidateSource` trait. Needs only
# `Chunk` and `regex`. A host with its own code index implements the trait and
# reuses all of this — no second index, no embedder.
ranking = []
# Hybrid BM25 + dense retrieval: `ranking` plus the built-in backend. This is
# the feature that carries real weight — an HTTP stack, a tokenizer, and a
# safetensors model loader.
search = [
    "ranking",
    "graphs",
    "dep:reqwest",
    "dep:tokenizers",
    "dep:safetensors",
    "dep:memmap2",
    "dep:wide",
    "dep:sha2",
    "dep:dirs",
]
# Structural pattern search and rewrite with metavariables.
run = ["dep:similar"]
# Reversible log/text compression. Standalone — no AST involvement at all.
squeeze = []

# The CLI exists to keep the vendored end-to-end tests runnable; it is not how
# artist uses this crate. It drives every command, so it implies `full`.
# On by default so `cargo test` works unqualified — consumers pass
# `default-features = false` to drop clap and everything they did not ask for.
cli = ["dep:clap", "full"]

[[bin]]
name = "ast-bro"
path = "src/bin/ast-bro.rs"
required-features = ["cli"]

[dependencies]
clap = { version = "4.5", features = ["derive"], optional = true }
ast-grep-core = "0.42.1"
ast-grep-language = "0.42.1"
tree-sitter = "0.26.3"
tree-sitter-md = "0.5.3"

# Always needed: the walker, the adapters' regex fallbacks, glob expansion in
# `path_glob`, and `colored`, which `core`'s renderers use.
ignore = "0.4.22"
regex = "1"
glob = "0.3.3"
colored = "3.1.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# `search::cache::hash_file` is always compiled — `graph_cache` reuses it for
# content-hash change detection — so this cannot be gated behind `search`.
xxhash-rust = { version = "0.8", features = ["xxh3"] }
tempfile = "3"

# `graphs`: parallel walk plus the on-disk graph cache and its lock file.
rayon = { version = "1.10", optional = true }
bincode = { version = "2", features = ["serde"], optional = true }
fs2 = { version = "0.4", optional = true }

# `run`: diffing rewrite previews.
similar = { version = "3", optional = true }

# `search`: the retrieval backend. Aligned to the versions already resolved
# elsewhere in this workspace rather than upstream's (dirs 5, sha2 0.10) so the
# tree carries one copy. These exist only to serve the default candidate
# source; an artist-memory backend replaces them behind the same trait.
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls-native-roots",
], optional = true }
tokenizers = { version = "0.21", default-features = false, features = [
    "onig",
], optional = true }
safetensors = { version = "0.6", optional = true }
memmap2 = { version = "0.9", optional = true }
wide = { version = "0.7", optional = true }
sha2 = { version = "0.11", optional = true }
dirs = { version = "6", optional = true }

# Dropped from upstream's manifest: `serde_yaml`, `jsonc-parser` and
# `toml_edit` were used only by `installers/`, which artist does not vendor.

[dev-dependencies]
