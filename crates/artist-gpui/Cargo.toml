[package]
name = "artist-gpui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "artist-gui"
path = "src/main.rs"

[dependencies]
# GPUI has no usable crates.io release, so the source identity remains the
# checksum-locked Zed commit used by gpui-component. The workspace root patches
# the GPUI crates to the audited vendored fork that adds Linux DMA-BUF surfaces;
# Cargo.lock still pins every other Zed crate to the same upstream revision.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["wayland", "x11"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "f0abdd9" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "f0abdd9" }
artist-ui-core = { path = "../artist-ui-core" }
artist-session = { path = "../artist-session" }
artist-config = { path = "../artist-config" }
artist-session-host = { path = "../artist-session-host" }
dirs = "6"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[features]
default = []
# CEF is provisioned by the checksum-pinned packaging task. Keeping the
# dependency optional lets CLI/TUI and ordinary workspace checks remain usable
# on development machines without the ~1GB runtime installed.
embedded-canvas = ["dep:gpui-webview", "dep:flume"]

[dependencies.gpui-webview]
path = "../../vendor/wef/crates/webview"
optional = true

[dependencies.flume]
version = "0.11"
optional = true
[dev-dependencies]
artist-computer = { path = "../artist-computer", default-features = false, features = ["stage-wayland"] }
log = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
