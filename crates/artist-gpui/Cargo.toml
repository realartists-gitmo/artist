[package]
name = "artist-gpui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "artist-gui"
path = "src/main.rs"

[dependencies]
# gpui has no usable crates.io release (the name holds a yanked 0.1.0 from 2022
# and a 0.1.0-test placeholder), so this is a pinned git rev. Pinned rather than
# floating on main because gpui carries no semver and its API tracks Zed's
# needs: an unpinned bump is an unscheduled migration.
# Keep these on the same locked Zed commit as gpui-component. Cargo.lock is the
# compatibility pin because gpui-component itself follows Zed's git source.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["wayland", "x11"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "f0abdd9" }
artist-ui-core = { path = "../artist-ui-core" }
artist-session = { path = "../artist-session" }
artist-config = { path = "../artist-config" }
artist-session-host = { path = "../artist-session-host" }
dirs = "6"
anyhow = "1"
serde_json = "1"
url = "2"

[features]
default = []
# CEF is provisioned by the checksum-pinned packaging task. Keeping the
# dependency optional lets CLI/TUI and ordinary workspace checks remain usable
# on development machines without the ~1GB runtime installed.
embedded-canvas = ["dep:gpui-webview", "dep:flume"]

[dependencies.gpui-webview]
path = "../../vendor/wef/crates/webview"
optional = true

[dependencies.flume]
version = "0.11"
optional = true
