[package]
name = "artist-kernel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
artist-ast = { path = "../artist-ast", default-features = false, features = ["surface", "graphs", "impact"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
cap-std = "4"
url = { version = "2", features = ["serde"] }
base64 = "0.23"
tempfile = "3"
teca = "1.0.0"
fff-search = { path = "../../vendor/fff/crates/fff-core" }
regex = "1"
futures = "0.3"
libc = "0.2"
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
wit-parser = "0.254.0"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync"] }
