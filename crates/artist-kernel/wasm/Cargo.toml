[package]
name = "artist-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
async-trait = "0.1"
artist-kernel = { path = ".." }
semver = "1"
tokio = { version = "1", features = ["sync"] }
wasmtime = { version = "47.0.3", default-features = false, features = ["std", "runtime", "component-model", "component-model-async", "async", "cranelift", "wat", "anyhow"] }
wasmtime-wasi = "47.0.3"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
