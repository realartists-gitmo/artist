[package]
name = "artist-wasm-nouns"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
artist-kernel = { path = "../.." }
artist-wasm = { path = ".." }
anyhow = "1"
async-trait = "0.1"
wasmtime = { version = "47.0.3", default-features = false, features = ["std", "runtime", "component-model", "component-model-async", "async", "cranelift", "wat", "anyhow"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
