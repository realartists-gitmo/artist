[package]
name = "artist-wasm-verbs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
artist-kernel = { path = "../.." }
artist-wasm = { path = ".." }
artist-wasm-filesystem = { path = "../filesystem" }
async-trait = "0.1"
fff-search = { package = "fff-search", path = "../../../../vendor/fff/crates/fff-core", default-features = false, features = ["ripgrep"] }
fff-query-parser = { path = "../../../../vendor/fff/crates/fff-query-parser", default-features = false, features = ["ripgrep"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toon-format = { version = "0.5", default-features = false }
wasmtime = { version = "47.0.3", default-features = false, features = ["std", "runtime", "component-model", "component-model-async", "async", "cranelift", "wat", "anyhow"] }
wasmtime-wasi = "47.0.3"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
