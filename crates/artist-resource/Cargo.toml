[package]
name = "artist-resource"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Native Windows builds may discover an installed WinFsp through the registry.
# The default remains cross-compilable and expects the WinFsp DLL beside the app.
winfsp-system = ["winfsp/system"]

[dependencies]
artist-core = { path = "../artist-core" }
async-trait.workspace = true
fff-search.workspace = true
globset.workspace = true
jsonschema.workspace = true
percent-encoding.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
similar.workspace = true
teca.workspace = true
thiserror.workspace = true
tempfile.workspace = true
tokio.workspace = true
url.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
fuser.workspace = true
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
fuser = { workspace = true, features = ["macfuse-4-compat"] }
libc.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
winfsp = "0.13.1"
