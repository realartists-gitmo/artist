[package]
name = "artist-mcp-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "artist-mcp"
path = "src/main.rs"

[dependencies]
artist-tool-api = { path = "../artist-tool-api" }
anyhow = "1"
artist-agent = { path = "../artist-agent" }
artist-canvas = { path = "../artist-canvas" }
artist-computer = { path = "../artist-computer" }
artist-memory = { path = "../artist-memory" }
artist-registry = { path = "../artist-registry" }
artist-session = { path = "../artist-session" }
artist-tools = { path = "../artist-tools" }
base64 = "0.23"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
futures = "0.3"
llm-provider = { path = "../llm-provider" }
jsonschema = "0.17"
rig-core = "0.41.0"
rmcp = { version = "2.2", features = ["server", "transport-io", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "time", "sync", "net", "signal"] }
tokio-util = "0.7"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
rmcp = { version = "2.2", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
