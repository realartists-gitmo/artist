[package]
name = "artist-component"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
artist-kernel = { path = "../artist-kernel" }
anyhow = "1"
sha2 = "0.10"
serde_json = "1"
serde_yaml = "0.9"
serde = { version = "1", features = ["derive"] }
walkdir = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
thiserror = "2"
wasmtime = { version = "47.0.3", default-features = false, features = ["std", "runtime", "component-model", "component-model-async", "async", "cranelift", "wat"] }
wasmtime-wasi = { version = "47.0.3", default-features = false, features = ["p2"] }

[dev-dependencies]
tempfile = "3"
