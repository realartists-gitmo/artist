[package]
name = "artist-component"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
artist-kernel = { path = "../artist-kernel" }
artist-wasm = { path = "../artist-kernel/wasm" }
artist-wasm-nouns = { path = "../artist-kernel/wasm/nouns" }
artist-wasm-url = { path = "../artist-kernel/wasm/url" }
artist-wasm-verbs = { path = "../artist-kernel/wasm/verbs" }
artist-wasm-composition = { path = "../artist-kernel/wasm/composition" }
artist-session = { path = "../artist-session" }
llm-provider = { path = "../llm-provider" }
anyhow = "1"
async-trait = "0.1"
sha2 = "0.10"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
walkdir = "2"
tokio = { version = "1", features = ["fs", "io-util", "process", "rt", "rt-multi-thread", "macros", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
thiserror = "2"
toon-format = { version = "0.5", default-features = false }
cap-std = "4"
gray_matter = "0.2"
serde_yaml = "0.9"
toml = "1.1"
cargo_metadata = "0.19"
escargot = "0.5"
futures = "0.3"
nix = { version = "0.31.3", features = ["signal", "process"] }
notify = "8"
notify-debouncer-mini = "0.7"
wasmtime = { version = "47.0.3", default-features = false, features = ["std", "runtime", "component-model", "component-model-async", "async", "cranelift", "wat"] }
wasmtime-wasi = { version = "47.0.3", default-features = false, features = ["p3"] }
wit-parser = "0.252.0"

[dev-dependencies]
tempfile = "3"
