[package]
name = "artist-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
artist-agent = { path = "../artist-agent" }
artist-component = { path = "../artist-component" }
artist-kernel = { path = "../artist-kernel" }
artist-wasm = { path = "../artist-kernel/wasm" }
artist-wasm-verbs = { path = "../artist-kernel/wasm/verbs" }
artist-session = { path = "../artist-session" }
fs2 = "0.4"
ansi-to-tui = "8.0.1"
arboard = { version = "3", features = ["wayland-data-control"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.12"
dirs = "6"
llm-provider = { path = "../llm-provider" }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
ratatui = { version = "0.30.2", features = ["scrolling-regions"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
textwrap = { version = "0.16", features = ["unicode-linebreak", "unicode-width"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
toon-format = { version = "0.5", default-features = false }
rig-core = "0.41.0"
toml = "1.1"
unicode-width = "0.2"
url = "2"

[dev-dependencies]
tempfile = "3"
