[package]
name = "artist-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "artist"
path = "src/main.rs"

[lib]
name = "artist_cli"
path = "src/main.rs"

[features]
default = ["webview"]
# WebKitGTK (Linux) and WebView2 (Windows) are system libraries, not crates.
# Building without this feature drops canvas windows, not canvases.
webview = ["dep:wry", "dep:tao"]

[dependencies]
artist-agent = { path = "../artist-agent" }
artist-canvas = { path = "../artist-canvas" }
tao = { version = "0.36", optional = true }
wry = { version = "0.56", optional = true }
artist-computer = { path = "../artist-computer" }
artist-extensions = { path = "../artist-extensions" }
artist-rules = { path = "../artist-rules", features = ["wasm"] }
artist-memory = { path = "../artist-memory" }
artist-session = { path = "../artist-session" }
artist-tools = { path = "../artist-tools" }
artist-ui-core = { path = "../artist-ui-core" }
fs2 = "0.4"
ansi-to-tui = "8.0.1"
arboard = { version = "3", features = ["wayland-data-control"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.12"
dirs = "6"
llm-provider = { path = "../llm-provider" }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
ratatui = { version = "0.30.2", features = ["scrolling-regions"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
textwrap = { version = "0.16", features = ["unicode-linebreak", "unicode-width"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time", "io-util"] }
tokio-util = "0.7"
rig-core = "0.41.0"
toml = "1.1"
unicode-width = "0.2"
url = "2"

[dev-dependencies]
proptest = "1"
tempfile = "3"
