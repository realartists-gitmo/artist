[package]
name = "artist-tool-abort"
version = "0.1.0"
edition = "2024"

[workspace]

[features]
default = ["abort"]
abort = []

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.57.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.product]
inherits = "release"
opt-level = 3
incremental = false
overflow-checks = false
strip = true
lto = "fat"
codegen-units = 1
