[package]
name = "artist-computer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Generalized computer use: one observation contract over every application surface"

[features]
# The compositor is the heaviest thing in the tree to build and needs libgbm,
# libEGL and a DRM render node. Gating it keeps the PTY, CDP and adapter rungs
# — and the whole test suite — usable on a machine without any of that.
default = ["stage-wayland", "ocr"]
stage-wayland = ["dep:smithay", "dep:calloop"]
# Text localization on rung 3. Separately gated because it carries ~20 MB of
# model weights, and a build that never drives a GUI has no use for them.
ocr = ["dep:rten", "dep:rten-tensor", "dep:rten-onnx"]

[dependencies]
artist-tool-api = { path = "../artist-tool-api" }
anyhow = "1"
artist-session = { path = "../artist-session" }
artist-tools = { path = "../artist-tools" }
async-trait = "0.1"
atspi-proxies = "0.13"

# Rung 3 text localization. The same pure-Rust CPU runtime artist-memory uses
# for embeddings — it loads ONNX directly, so PP-OCR needs no conversion step
# and no C++ toolchain.
rten = { version = "0.24", optional = true }
rten-tensor = { version = "0.24", optional = true }
# Graph inspection only, for the `inspect-ocr-graph` example.
rten-onnx = { version = "0.24", optional = true }
base64 = "0.23"
blake3 = "1"
# Must match the calloop smithay itself uses, or the XWayland event source
# cannot be inserted into our loop.
calloop = { version = "0.14", optional = true }
# No default features: they pull in `chromiumoxide_fetcher`, which exists to
# download a Chromium build. The stage always launches the system browser
# itself, so the fetcher is dead weight that also fails to compile.
chromiumoxide = { version = "0.9", default-features = false }
dashmap = "6"
dirs = "6"
futures = "0.3"
toml = "1.1"
hashline-tools = { path = "../hashline-tools" }
png = "0.18"
portable-pty = "0.9"
rig-core = "0.41.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The viewer is a Wayland *client* on the user's real display, importing the
# stage's render target as a dmabuf. Client and server in one crate is unusual
# but correct here: they share the buffer type, and the whole design is that the
# thing drawn into and the thing shown are the same memory.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
smithay = { version = "0.7", default-features = false, features = [
    "backend_egl",
    "backend_gbm",
    "renderer_gl",
    "wayland_frontend",
    "desktop",
    "xwayland",
], optional = true }
thiserror = "2"
# `process` is for the Android supervisor: Waydroid's session and property
# control is a CLI, and running it needs stdout back rather than the stage's
# fire-and-forget spawn.
tokio = { version = "1", features = ["macros", "process", "rt", "sync", "time"] }
unicode-normalization = "0.1"
vt100 = "0.16"
# Keep Zbus on the async-io backend. GPUI's AccessKit adapter uses that backend,
# and enabling Tokio here would unify both Zbus runtimes in the GUI process;
# Zbus then selects Tokio from GPUI worker threads that have no Tokio reactor.
zbus = { version = "5", default-features = false, features = ["async-io"] }

[dev-dependencies]
tempfile = "3"
# So the fixture client can allocate a real GPU buffer and hand it over as a
# dmabuf. Advertising `zwp_linux_dmabuf` is easy to get wrong in a way no
# registry assertion catches — the global is there, the import fails, and the
# client shows a blank window. Only a client that actually allocates proves it.
# Already in the graph as smithay's own allocator, so this costs no build time.
gbm = "0.18"
tokio = { version = "1", features = ["rt-multi-thread"] }
# The test fixture drives the compositor with a client of our own; the same two
# crates now also carry the viewer, so they are ordinary dependencies above.
