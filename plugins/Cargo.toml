[workspace]
members = [
    "sdk",
    "prompt",
    "context",
    "hooks",
    "model",
    "events",
    "file-read",
    "file-children",
    "file-write",
    "file-edit",
    "file-move",
    "profiles-read",
    "profiles-children",
    "plugins-read",
    "plugins-children",
    "plugins-write",
    "plugins-edit",
    "plugins-move",
    "plugins-signal",
    "tool-read",
    "tool-find",
    "tool-grep",
    "tool-write",
    "tool-edit",
    "tool-move",
    "tool-poll",
    "tool-run",
    "tool-signal",
    "tool-yield",
    "tool-handoff",
    "concurrent-resource-fixture",
]
resolver = "3"

[workspace.dependencies]
artist-plugin-sdk = { path = "sdk" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
