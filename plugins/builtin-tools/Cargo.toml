[package]
name = "artist-builtin-tools"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = { version = "0.46.0", default-features = false, features = ["macros", "realloc", "std"] }
