name = "default-tools"
version = "0.1.0"
route_hints = ["read", "write", "edit", "move", "find", "grep", "profile://filesystem", "process://filesystem", "provider://openai", "agent://*"]

[[tools]]
name = "read"
description = "Read a bounded text or binary resource fragment."
input_schema = '''{"type":"object","properties":{"uri":{"type":"string"},"range":{"type":"string","description":"Relative line range such as -20..+40"}},"required":["uri"],"additionalProperties":false}'''

[[tools]]
name = "write"
description = "Replace a resource with text content."
input_schema = '''{"type":"object","properties":{"uri":{"type":"string"},"content":{"type":"string"}},"required":["uri","content"],"additionalProperties":false}'''

[[tools]]
name = "move"
description = "Move a resource to an optional destination."
input_schema = '''{"type":"object","properties":{"source":{"type":"string"},"destination":{"type":["string","null"]}},"required":["source"],"additionalProperties":false}'''

[[tools]]
name = "edit"
description = "Apply anchored replacements to a resource."
input_schema = '''{"type":"object","properties":{"uri":{"type":"string"},"changes":{"type":"array","items":{"type":"object","properties":{"anchor":{"type":"string"},"replacement":{"type":"string"}},"required":["anchor","replacement"],"additionalProperties":false}}},"required":["uri","changes"],"additionalProperties":false}'''

[[tools]]
name = "find"
description = "Find resources below a URI."
input_schema = '''{"type":"object","properties":{"uri":{"type":"string"},"query":{"type":"string"},"limit":{"type":"integer","minimum":1,"maximum":500},"mode":{"type":"string","enum":["literal","glob","fuzzy"]}},"required":["uri","query"],"additionalProperties":false}'''

[[tools]]
name = "grep"
description = "Search text resources below a URI."
input_schema = '''{"type":"object","properties":{"uri":{"type":"string"},"query":{"type":"string"},"limit":{"type":"integer","minimum":1,"maximum":500},"mode":{"type":"string","enum":["literal","plain","regex"]}},"required":["uri","query"],"additionalProperties":false}'''
