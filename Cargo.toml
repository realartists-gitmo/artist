[workspace]
members = [
    "crates/artist-kernel",
    "crates/artist-kernel/vfs",
    "crates/artist-kernel/vfs/windows",
    "crates/artist-kernel/wasm",
    "crates/artist-kernel/wasm/nouns",
    "crates/artist-kernel/wasm/resources",
    "crates/artist-kernel/wasm/url",
    "crates/artist-default-tools",
    "crates/artist-default-prompt",
    "crates/artist-root",
    "crates/artist-kernel/wasm/verbs",
    "crates/artist-kernel/wasm/events",
    "crates/artist-kernel/wasm/composition",
    "crates/artist-kernel/wasm/filesystem",
    "crates/artist-ast",
    "crates/llm-provider",
    "crates/artist-cli",
    "crates/artist-agent",
    "crates/artist-session",
    "crates/artist-component",
]
resolver = "3"
exclude = ["vendor/fff"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97"

[profile.dev]
split-debuginfo = "unpacked"

[profile.release]
# Incremental release artifacts can produce missing LLVM-local symbols when
# combined with parallel backend codegen, particularly in Wasmtime-heavy crates.
incremental = false
split-debuginfo = "unpacked"

[profile.profiler]
inherits = "release"
opt-level = 3
overflow-checks = false
debug = "line-tables-only"
split-debuginfo = "unpacked"
strip = false

[profile.product]
inherits = "release"
opt-level = 3
incremental = false
overflow-checks = false
strip = true
lto = "fat"
codegen-units = 1

# Profiling builds: release codegen + debug symbols, separate cache so samply
# runs never invalidate the plain release artifacts.
[profile.release-debug]
inherits = "release"
debug = true
