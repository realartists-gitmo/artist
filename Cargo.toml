[workspace]
members = ["crates/artist-python"]
resolver = "3"

[package]
name = "artist"
version = "0.1.0"
edition = "2024"
description = "A durable, append-only agent harness"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
usage = { package = "usage-rs", version = "6" }
dirs = "6"
jsonschema = "0.51"
parking_lot = "0.12"
rig-core = "0.42"
rusqlite = { version = "0.40", features = ["bundled"] }
schemars = { version = "1", features = ["uuid1", "chrono04"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
wasmtime = { version = "48", default-features = false, features = ["async", "component-model", "component-model-async", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "48", default-features = false, features = ["p3"] }

[dev-dependencies]
tempfile = "3"
