[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
async-stream = "0.3.6"
async-trait = "0.1.89"
fff-search = "=0.10.5"
fuser = { version = "0.17", default-features = false }
fs2 = "0.4.3"
futures = "0.3.31"
globset = "0.4.16"
libc = "0.2.175"
percent-encoding = "2.3.2"
regex = "1.11.2"
rig-agent = { version = "0.42.0", default-features = false }
rig-core = { version = "0.42.0", default-features = false }
rig-memory = "0.42.0"
schemars = "1.2.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
tempfile = "3.21.0"
wasmtime = { version = "38.0.4", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "38.0.4", default-features = false, features = ["p2"] }
