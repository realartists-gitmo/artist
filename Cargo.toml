cargo-features = ["profile-rustflags"]

[workspace]
members = [
    "crates/llm-provider",
    "crates/artist-cli",
    "crates/artist-agent",
    "crates/artist-tools",
    "crates/artist-session",
    "crates/artist-memory",
    "crates/artist-logic",
    "crates/artist-rules",
    "crates/hashline-tools",
    "crates/artist-extensions",
    "crates/artist-canvas",
    "crates/artist-computer",
    "crates/artist-ast",
    "crates/artist-config",
    "crates/artist-registry",
    "crates/artist-ui-core",
    "crates/artist-gpui",
    "crates/artist-session-host",
    "crates/artist-mcp-server",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97"

[profile.dev]
split-debuginfo = "unpacked"

[profile.release]
rustflags = ["-Z", "threads=0"]
# Incremental release artifacts can produce missing LLVM-local symbols when
# combined with parallel backend codegen, particularly in Wasmtime-heavy crates.
incremental = false
split-debuginfo = "unpacked"

# `cargo test --release` builds test targets with the bench profile and their
# dependencies with release — so tests reuse the same dependency artifacts the
# app build already produced instead of maintaining a parallel debug tree.
#
# Release defaults both of these to off. Keeping them on costs nothing at
# runtime for a test binary and preserves what a debug test run would catch:
# integer overflow panics instead of silently wrapping, and debug_assert! in
# our own code and in rig.
[profile.bench]
debug-assertions = true
overflow-checks = true

[profile.profiler]
inherits = "release"
opt-level = 3
overflow-checks = false
debug = "line-tables-only"
split-debuginfo = "unpacked"
strip = false

[profile.product]
inherits = "release"
opt-level = 3
incremental = false
overflow-checks = false
strip = true
lto = "fat"
codegen-units = 1
rustflags = ["-C", "target-cpu=native", "-Z", "tune-cpu=native"]

# Profiling builds: release codegen + debug symbols, separate cache so samply
# runs never invalidate the plain release artifacts.
[profile.release-debug]
inherits = "release"
debug = true

# rten-text cannot load SentencePiece-derived tokenizers (Gemma, Llama): its
# `Split` pre-tokenizer rejects the `MergedWithPrevious` behaviour, and its BPE
# hard-requires the GPT-2 byte alphabet in the vocabulary, which those models do
# not have. This is a local checkout carrying both fixes; the diff is at
# `scripts/rten-text-sentencepiece.patch` and is intended for upstream.
[patch.crates-io]
rten-text = { path = "../../rten-src/rten-text" }

# mnestic 0.13.1 on crates.io predates `set_durable_writes`, so RocksDB commits
# without fsyncing its WAL and a power cut can lose acknowledged writes. The fix
# is upstream but unreleased, so we track the repo rather than carrying a
# backported copy of a stale release.
mnestic = { path = "../../mnestic-src/cozo-core" }
